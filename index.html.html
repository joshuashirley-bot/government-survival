<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Government Survival: After the Fall</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#eef1f5,#11151b);--surface:light-dark(#fff,#1b2129);--surface2:light-dark(#f5f7fa,#242b35);--text:light-dark(#17202a,#f3f5f7);--muted:light-dark(#5d6875,#aeb8c4);--border:light-dark(#d8dee6,#3a4450);--accent:light-dark(#173f5f,#73b7e6);--accent2:light-dark(#c77b30,#e4a05c)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{min-height:100vh}.shell{max-width:920px;margin:0 auto;padding:28px 20px 56px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.brand{letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;font-weight:800;color:var(--muted)}.step{font-size:.82rem;color:var(--muted)}.progress{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:28px}.progress>div{height:100%;background:var(--accent);transition:width .35s ease}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:34px;box-shadow:0 10px 35px rgba(0,0,0,.07)}.card:before{content:"☣  ☠   ☣   ☠   ☣";display:block;margin:-34px -34px 24px;padding:18px 24px;text-align:center;letter-spacing:.55em;font-size:2rem;line-height:1;color:#d8c77a;background:linear-gradient(180deg,#202a32,#151b20);border-radius:18px 18px 0 0;text-shadow:0 3px 10px rgba(0,0,0,.7)}.eyebrow{color:var(--accent2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;margin-bottom:10px}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.03;margin:0 0 16px;letter-spacing:-.035em}h2{font-size:clamp(1.5rem,3vw,2.2rem);line-height:1.1;margin:0 0 14px}p{line-height:1.65;color:var(--muted)}.lead{font-size:1.08rem;max-width:700px}.instructions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.instruction{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:15px}.instruction strong{display:block;margin-bottom:4px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:750}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.choice-grid{display:grid;gap:12px;margin-top:24px}.choice{width:100%;text-align:left;padding:18px 19px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:13px;cursor:pointer;display:flex;gap:15px;align-items:flex-start;transition:transform .15s,border-color .15s,background .15s}.choice:hover{transform:translateY(-1px);border-color:var(--accent);background:var(--surface)}.letter{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-weight:850}.choice-text{line-height:1.45;font-weight:650}.scenario{margin-top:18px;padding:17px;border-left:4px solid var(--accent2);background:var(--surface2);border-radius:0 10px 10px 0}.result{text-align:center}.result-badge{display:inline-block;border:1px solid var(--border);background:var(--surface2);padding:9px 14px;border-radius:99px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:.75rem}.result h1{margin-top:18px}.result-box{text-align:left;margin:26px auto;max-width:700px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:22px}.traits{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.trait{padding:12px;border:1px solid var(--border);border-radius:10px}.trait span{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}.small{font-size:.88rem}.footer-note{margin-top:20px;color:var(--muted);font-size:.82rem;text-align:center}@media(max-width:700px){.card{padding:24px 19px}.instructions{grid-template-columns:1fr}.traits{grid-template-columns:1fr}.topbar{align-items:flex-start}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const scenarios=[
{title:"A Leader Emerges",text:"The dead have overrun the cities. Your group of 40 survivors has found a defensible farm, but food, medicine, and ammunition are running low. Someone must coordinate survival. How should the first leader be selected?",choices:[["Everyone votes, and the person with the most votes leads for a limited term.",[4,0,0,0,0]],["The strongest and most capable person should take control immediately.",[0,4,0,0,0]],["A small council of the most experienced survivors should choose one leader.",[0,0,4,0,0]],["No one should be in charge. People should organize themselves as needed.",[0,0,0,4,0]]]},
{title:"The First Rule",text:"A fight breaks out over the last antibiotics. Outside the walls, the dead are gathering. Your new settlement needs a rule for conflicts. Which approach do you choose?",choices:[["Create a written rule that applies to everyone and let an elected assembly decide disputes.",[4,0,0,0,0]],["Give the leader final authority to decide disputes quickly.",[0,4,0,0,0]],["Let the council of experienced people decide each case.",[0,0,4,0,0]],["Let the people involved settle it themselves without government rules.",[0,0,0,4,0]]]},
{title:"The Walls Are Breached",text:"A herd of walkers is moving toward the settlement, and the outer fence has been damaged. There are only a few hours to prepare. What happens to government during the emergency?",choices:[["The elected government keeps operating, but emergency powers are temporary and reviewed later.",[4,0,0,0,0]],["The leader receives unlimited emergency power until the danger has passed.",[0,5,0,0,0]],["The council takes over because a small group can act faster.",[0,0,4,0,0]],["Everyone decides individually what to do; there is no central authority.",[0,0,0,4,0]]]},
{title:"Who Makes the Rules?",text:"Months pass. The settlement is growing, but people disagree about weapons, food, work, and who may enter the gates. Who should have the strongest voice?",choices:[["Representatives chosen by the people debate and vote on laws.",[5,0,0,0,0]],["The leader decides which laws are necessary.",[0,5,0,0,0]],["A small group of property owners and experts writes the laws.",[0,0,5,0,0]],["There should be as few common laws as possible.",[0,0,0,5,0]]]},
{title:"A Dangerous Voice",text:"A survivor publicly criticizes the leader and says the settlement's policies are putting everyone in danger. Some people want the speaker expelled before the disagreement divides the group. What should happen?",choices:[["The criticism is protected, unless it directly threatens someone with violence.",[5,0,0,0,0]],["The government should silence criticism that could weaken the leader's authority.",[0,5,0,0,0]],["The council decides which criticism is acceptable.",[0,0,5,0,0]],["There should be no government restrictions, even if the speech causes serious conflict.",[0,0,0,5,0]]]},
{title:"Choosing the Next Leader",text:"After a year, the original leader is exhausted and wants to step down. The settlement is stable enough to choose what happens next. What should happen?",choices:[["Hold a fair election with more than one candidate.",[5,0,0,0,0]],["The current leader chooses a successor.",[0,5,0,0,0]],["The council selects the next leader.",[0,0,5,0,0]],["Leadership should rotate informally among whoever is willing to do the work.",[0,0,0,5,0]]]},
{title:"The Supply Problem",text:"A few families control the best farmland, tools, and ammunition. They offer to keep the settlement supplied if they receive special political influence. Do you accept?",choices:[["No. Political influence should not be bought; laws should apply equally.",[5,0,0,0,0]],["Yes. Wealthy supporters can help the leader govern effectively.",[0,4,1,0,0]],["Yes, but give the wealthy families formal seats on a governing council.",[0,0,5,0,0]],["Allow private groups to do whatever they want; government should stay out of it.",[0,0,0,5,0]]]},
{title:"Justice",text:"Someone is accused of stealing medicine from the infirmary. The evidence is uncertain, and the person claims they were trying to save a sick family member. What should the government do?",choices:[["Provide a fair hearing and require evidence before punishment.",[5,0,0,0,0]],["Punish the accused immediately to discourage others from stealing.",[0,5,0,0,0]],["Let a council of respected citizens decide the punishment.",[0,0,5,0,0]],["There should be no central justice system; the community can handle it itself.",[0,0,0,5,0]]]},
{title:"The Popular Leader",text:"A popular leader has successfully defended the settlement from several walker attacks. The leader says elections are dangerous and promises everyone will be safer if they remain in charge permanently. What do you choose?",choices:[["Keep regular elections and term limits even if the leader is popular.",[6,0,0,0,0]],["Allow the leader to stay indefinitely because the people trust them.",[0,6,0,0,0]],["Allow the council to decide whether the leader should remain.",[0,0,5,0,0]],["Reject permanent government and let communities govern themselves.",[0,0,0,5,0]]]},
{title:"Food, Water, and Work",text:"Winter is coming. The settlement needs a well, stronger walls, and larger food stores. Everyone must contribute labor or supplies. How should the contribution be decided?",choices:[["An elected legislature approves a tax and lets voters hold representatives accountable.",[5,0,0,0,0]],["The leader sets the amount and collects it immediately.",[0,5,0,0,0]],["A council of major landowners and specialists determines the contribution.",[0,0,5,0,0]],["People contribute only if they personally agree with the project.",[0,0,0,5,0]]]},
{title:"The Other Settlement",text:"A larger neighboring settlement demands half your food in exchange for protection from the walkers. Your government must decide quickly. Who has the final say?",choices:[["The elected government acts, but the legislature and courts retain oversight.",[5,0,0,0,0]],["The leader has final authority and can ignore other institutions during the crisis.",[0,6,0,0,0]],["A small governing council makes the decision for everyone.",[0,0,6,0,0]],["Each community decides whether and how to respond.",[0,0,0,6,0]]]},
{title:"Your Settlement's Future",text:"Two years have passed since the world fell apart. The dead still roam beyond the walls, but your settlement has survived. You now have a chance to establish the permanent structure of your government. Which principle matters most?",choices:[["Power comes from the people, leaders are accountable, and rights are protected.",[7,0,0,0,0]],["Strong centralized leadership is more important than limits on government power.",[0,7,0,0,0]],["A capable minority should guide the government for the sake of stability.",[0,0,7,0,0]],["Individuals and local groups should retain as much independence from government as possible.",[0,0,0,7,0]]]}
];
let state={screen:"intro",index:0,scores:[0,0,0,0,0],answers:[]};
const labels=["Democracy","Autocracy","Oligarchy","Decentralized / Anarchic","Theocracy"];
function render(){const app=document.getElementById("app");if(state.screen==="intro")app.innerHTML=intro();else if(state.screen==="quiz")app.innerHTML=quiz();else app.innerHTML=result()}
function intro(){return `<div class="shell"><div class="topbar"><div class="brand">Government Survival</div><div class="step">Post-Apocalyptic Simulation</div></div><div class="card"><div class="eyebrow">The world has fallen</div><h1>Can your settlement survive?</h1><p class="lead">The cities are gone. The dead walk outside the walls. You and a group of survivors have one chance to build a society that can survive. Every decision you make will shape who holds power, how rules are enforced, and what happens to individual freedom.</p><div class="instructions"><div class="instruction"><strong>12 survival decisions</strong><span class="small">Each situation forces a choice that affects your settlement.</span></div><div class="instruction"><strong>There is no safe answer</strong><span class="small">Every choice has consequences. Choose what you believe is best.</span></div><div class="instruction"><strong>Hidden government</strong><span class="small">Your form of government is revealed only after the final decision.</span></div></div><div class="scenario"><strong>You cannot go back.</strong> Read each choice carefully. Once you make a decision, the settlement must live with it.</div><div class="actions"><button class="btn primary" onclick="start()">Enter the settlement</button></div></div><div class="footer-note">Classroom simulation • Government, power, rights & survival</div></div>`}
function quiz(){const s=scenarios[state.index];const pct=Math.round(state.index/scenarios.length*100);return `<div class="shell"><div class="topbar"><div class="brand">Government Survival</div><div class="step">Decision ${state.index+1} of ${scenarios.length}</div></div><div class="progress"><div style="width:${pct}%"></div></div><div class="card"><div class="eyebrow">${s.title}</div><h2>${s.text}</h2><p>Choose the response your government should take. Think about who gets power, how power is limited, and what happens to individual rights.</p><div class="choice-grid">${s.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span class="choice-text">${c[0]}</span></button>`).join("")}</div></div></div>`}
function result(){const ranked=state.scores.map((score,index)=>({score,index})).sort((a,b)=>b.score-a.score);const max=ranked[0].score;const second=ranked[1].score;const type=(max-second<=1&&max>0)?4:ranked[0].index;const d=[["A government where political power ultimately comes from the people. Elections, accountable leaders, protected rights, and limits on power are central.","Your choices repeatedly favored participation, accountability, equal treatment, and limits on government authority."],["A government where power is concentrated in one leader or a small executive authority, with fewer meaningful limits on that power.","Your choices repeatedly favored speed, centralized authority, strong leadership, and fewer restrictions on executive power."],["A government where political power is concentrated in a small group of people, such as an elite council, wealthy class, or selected experts.","Your choices repeatedly favored decision-making by a smaller, established group rather than the population as a whole."],["A system with very little centralized authority, where individuals and local groups retain most decision-making power.","Your choices repeatedly favored independence from centralized government and voluntary cooperation."],["A government in which religious authority or religious law plays the central role in political decision-making.","Your choices repeatedly favored organizing political authority around religious beliefs, leaders, or laws."]];return `<div class="shell"><div class="topbar"><div class="brand">Government Survival</div><div class="step">Simulation complete</div></div><div class="card result"><div class="result-badge">Your result</div><h1>${labels[type]}</h1><p class="lead">${d[type][0]}</p><div class="result-box"><h2>How you got here</h2><p>${d[type][1]}</p><div class="traits"><div class="trait"><span>Primary direction</span>${labels[type]}</div><div class="trait"><span>Decisions made</span>${state.answers.length}</div></div></div><p class="small"><strong>Remember:</strong> This simulation simplifies real political systems. Most real governments contain a mixture of institutions and practices.</p><div class="actions" style="justify-content:center"><button class="btn primary" onclick="restart()">Run the simulation again</button><button class="btn" onclick="showSummary()">View decision summary</button></div><div id="summary"></div></div></div>`}
function start(){state={screen:"quiz",index:0,scores:[0,0,0,0,0],answers:[]};render()}
function choose(i){const c=scenarios[state.index].choices[i];c[1].forEach((v,j)=>state.scores[j]+=v);state.answers.push(i);state.index++;if(state.index>=scenarios.length)state.screen="result";render()}
function restart(){start()}
function showSummary(){const el=document.getElementById("summary");el.innerHTML='<div class="result-box"><h2>Your choices</h2>'+state.answers.map((a,i)=>`<p><strong>${i+1}. ${scenarios[i].title}:</strong> ${String.fromCharCode(65+a)} — ${scenarios[i].choices[a][0]}</p>`).join("")+"</div>"}
render();
</script>
</body>
</html>
